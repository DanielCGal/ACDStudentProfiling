services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: studentprofiling
      POSTGRES_PASSWORD: student123456789
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: studentprofiling@admin.com #access to pgadmin interfacc
      PGADMIN_DEFAULT_PASSWORD: studentprofiling123
    ports:
      - "5050:80"
    restart: always
    depends_on:
      - postgres

volumes:
  postgres_data: