<!-- special-status.html (VIEW-ONLY; read-only fields, Back only) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Special Status</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
  body{background:#78F2FF;color:#000;min-height:100vh}
  .sidebar{position:fixed;inset:0 auto 0 0;width:260px;height:100vh;background:#C7E7EB;color:#0b0f19;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .avatar{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #d3dde6}
  .side-btn{width:100%;padding:10px 14px;border:0;border-radius:22px;background:#0d47a1;color:#fff;cursor:pointer;font-weight:600}
  .main{margin-left:260px;padding:24px;min-height:100vh}
  .card{background:#3e8086;color:#fff;border-radius:28px;padding:22px;max-width:1100px;box-shadow:0 8px 18px rgba(0,0,0,.12)}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hdr h1{font-size:34px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .lbl{font-weight:700;margin:6px 0 4px}
  .input{width:100%;padding:12px 14px;border:0;border-radius:26px;background:#ddd;color:#000}
  .row{margin-bottom:10px}
  .section-title{font-size:28px;margin:18px 0 6px}
  .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:16px}
  .btn{padding:10px 16px;border:0;border-radius:22px;font-weight:700;cursor:pointer}
  .muted{background:#999;color:#fff}
  @media (max-width:980px){.main{margin-left:0}.sidebar{position:static;width:100%;height:auto;flex-direction:row;justify-content:center}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="avatar"></div>
    <div style="font-weight:700;line-height:1.2;text-align:left;width:100%">Special<br/>Status</div>
    <button class="side-btn" id="backBtn">Back</button>
  </aside>

  <main class="main">
    <section class="card">
      <div class="hdr"><h1>Special Status</h1></div>

      <div class="row"><div class="lbl">Name</div><input class="input" id="name" disabled /></div>

      <div class="section-title">Working Student</div>
      <div class="row"><div class="lbl">Place of Work</div><input class="input" id="workPlace" disabled /></div>
      <div class="row"><div class="lbl">Shift Hours</div><input class="input" id="shiftHours" disabled /></div>
      <div class="grid2">
        <div><div class="lbl">Are you the Breadwinner?</div><input class="input" id="breadwinner" disabled /></div>
        <div><div class="lbl">Are you financing your school?</div><input class="input" id="selfFinance" disabled /></div>
      </div>

      <div class="section-title">Orphan Student</div>
      <div class="grid2">
        <div><div class="lbl">Date of Parental Loss (Mother)</div><input class="input" id="motherLossDate" disabled /></div>
        <div><div class="lbl">Date of Parental Loss (Father)</div><input class="input" id="fatherLossDate" disabled /></div>
        <div><div class="lbl">Name of Parent (Mother)</div><input class="input" id="motherName" disabled /></div>
        <div><div class="lbl">Name of Parent (Father)</div><input class="input" id="fatherName" disabled /></div>
      </div>

      <div class="actions"><button class="btn muted" id="closeBtn">Back</button></div>
    </section>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const students = JSON.parse(localStorage.getItem('students') || '[]');
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'));
  const s = students.find(x => String(x.id) === String(id)) || {};
  const sp = s.specialStatus || {};
  $('name').value = s.name || '';
  $('workPlace').value = sp.workPlace || '';
  $('shiftHours').value = sp.shiftHours || '';
  $('breadwinner').value = sp.breadwinner || '';
  $('selfFinance').value = sp.selfFinance || '';
  $('motherLossDate').value = sp.motherLossDate || '';
  $('fatherLossDate').value = sp.fatherLossDate || '';
  $('motherName').value = sp.motherName || '';
  $('fatherName').value = sp.fatherName || '';
  const back = () => history.back();
  $('backBtn').onclick = back;
  $('closeBtn').onclick = back;
</script>
</body>
</html>
