<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dean/Secretary Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{--clr-sky:#2196f3;--clr-dark-sky:#0d47a1;--clr-bg:#1DA5DB}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
    body{background:var(--clr-bg);color:#000;min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;width:250px;height:100vh;background:#6ABAE6;color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:2px 0 0 rgba(0,0,0,.06)}
    .avatar{width:90px;height:90px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #d3dde6;margin-bottom:16px}
    .side-btn{background:var(--clr-dark-sky);color:#fff;border-radius:8px;width:100%;padding:10px 14px;border:0;cursor:pointer}
    .side-btn:hover{background:#09377a}
    .side-btn:active{transform:translateY(1px)}
    .main{margin-left:260px;padding:24px;min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start}
    .card{width:100%;max-width:980px;background:#6ABAE6;color:#fff;padding:24px;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.12)}
    .card h1{margin-bottom:16px}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    label{display:flex;flex-direction:column;gap:6px;font-weight:600}
    input{padding:10px;border:0;border-radius:8px;background:#e6f1f7;color:#000}
    .full{grid-column:1/-1}
    .actions{grid-column:1/-1;display:flex;gap:10px}
    .note{grid-column:1/-1;color:#0b0f19;background:#eaf4ff;border-radius:8px;padding:10px}
    .err{grid-column:1/-1;color:#641e16;background:#fdecea;border:1px solid #f5c6cb;border-radius:8px;padding:10px;display:none}
    .ok{grid-column:1/-1;color:#0f5132;background:#d1e7dd;border:1px solid #badbcc;border-radius:8px;padding:10px;display:none}
    @media (max-width:880px){
      .sidebar{position:static;width:100%;height:auto;flex-direction:row;justify-content:center;gap:8px}
      .main{margin-left:0;padding:16px}
      .form{grid-template-columns:1fr}
    }
    html, body { height: 100%; }
    .bg-rays{
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180vw;
      height: 180vh;
      pointer-events: none;
      user-select: none;
      z-index: -1;            
    }

    .bg-rays .ray{
      position: absolute;
      inset: 0;
      background: rgba(152,199,238,.623);
      clip-path: polygon(50% 50%, 100% 49%, 100% 51%);
    }

    .bg-rays .r1{transform:rotate(0deg)}
    .bg-rays .r2{transform:rotate(45deg)}
    .bg-rays .r3{transform:rotate(90deg)}
    .bg-rays .r4{transform:rotate(135deg)}
    .bg-rays .r5{transform:rotate(180deg)}
    .bg-rays .r6{transform:rotate(225deg)}
    .bg-rays .r7{transform:rotate(270deg)}
    .bg-rays .r8{transform:rotate(315deg)}


  </style>
  <link rel="stylesheet" href="responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body>

  <div class="bg-rays" aria-hidden="true">
    <div class="ray r1"></div><div class="ray r2"></div>
    <div class="ray r3"></div><div class="ray r4"></div>
    <div class="ray r5"></div><div class="ray r6"></div>
    <div class="ray r7"></div><div class="ray r8"></div>
  </div>

  <aside class="sidebar">
    <div class="avatar"></div>
    <h2 style="text-align:center">Welcome<br>Back!</h2>
    <button class="side-btn" id="accountBtn">Account</button>
    <button class="side-btn" id="logoutBtn">Logout</button>
    <button class="side-btn" id="backBtn">Back</button>
  </aside>

  <main class="main">
    <section class="card">
      <h1>Account Settings</h1>
      <form id="form" class="form" autocomplete="off">
        <label class="full">Email
          <input id="email" type="email" required disabled />
        </label>

        <div class="note">
          To change your email/password, click Edit, enter your current (old) password, then your new password.  
          Your old password must match before changes are saved.
        </div>

        <label id="oldPassWrap" class="full" style="display:none">Old Password
          <input id="oldPassword" type="password" minlength="1" disabled />
        </label>

        <label id="newPassWrap" class="full" style="display:none">New Password
          <input id="newPassword" type="password" minlength="1" disabled />
        </label>

        <div id="error" class="err"></div>
        <div id="ok" class="ok"></div>

        <div class="actions">
          <button type="button" class="side-btn" id="editBtn">Edit</button>
          <button type="button" class="side-btn" style="background:#999;display:none" id="doneBtn">Done</button>
          <button type="button" class="side-btn" style="background:#777;display:none" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const API_BASE = 'https://4efa0ea5cdc7.ngrok-free.app';
    const $ = id => document.getElementById(id);
  
    const role = localStorage.getItem('session');
    if (role !== 'dean' && role !== 'secretary') {
      location.href = 'index.html';
    }
  
    function loadCurrentEmail() {
      const em = localStorage.getItem('staff_email') || '';
      $('email').value = em;
    }
  
    function setEditing(on) {
      $('email').disabled = !on;
      $('oldPassword').disabled = !on;
      $('newPassword').disabled = !on;
      $('oldPassWrap').style.display = on ? 'block' : 'none';
      $('newPassWrap').style.display = on ? 'block' : 'none';
      $('editBtn').style.display  = on ? 'none'  : 'inline-block';
      $('doneBtn').style.display  = on ? 'inline-block' : 'none';
      $('cancelBtn').style.display= on ? 'inline-block' : 'none';
      if (on) $('oldPassword').focus();
      $('error').style.display = 'none';
      $('ok').style.display = 'none';
    }
  
    async function saveChanges() {
      const currentEmail = localStorage.getItem('staff_email') || '';
      const newEmail     = $('email').value.trim();
      const oldPassword  = $('oldPassword').value.trim();
      const newPassword  = $('newPassword').value.trim();
  
      if (!currentEmail) return showError('Missing current email in session.');
      if (!oldPassword)  return showError('Please enter your old password.');
      if (!newEmail && !newPassword) return showError('Enter a new email or new password to change.');
  
      try {
        const res = await axios.put(`${API_BASE}/studentprofiling/account/update-credentials`, {
          currentEmail,
          oldPassword,
          newEmail: newEmail || currentEmail,
          newPassword: newPassword || undefined
        }, { headers: { 'ngrok-skip-browser-warning': 'true' } });
  
        const { status, email } = res.data || {};
        if (status === 'ok') {
          if (email) localStorage.setItem('staff_email', email);
          showOk('Credentials updated.');
          setEditing(false);
        } else if (status === 'invalid-old-password') {
          showError('Old password is incorrect.');
        } else if (status === 'email-taken') {
          showError('That email is already in use.');
        } else {
          showError('Update failed. Please try again.');
        }
      } catch {
        showError('Update failed. Please try again.');
      }
    }
  
    function showError(msg){ const el=$('error'); el.textContent=msg; el.style.display='block'; $('ok').style.display='none'; }
    function showOk(msg){ const el=$('ok'); el.textContent=msg; el.style.display='block'; $('error').style.display='none'; }
  
    loadCurrentEmail();
    setEditing(false);
    $('editBtn').onclick   = () => setEditing(true);
    $('cancelBtn').onclick = () => { loadCurrentEmail(); $('oldPassword').value=''; $('newPassword').value=''; setEditing(false); };
    $('doneBtn').onclick   = saveChanges;
  
    $('logoutBtn').onclick = () => { localStorage.removeItem('session'); location.href='index.html'; };
    $('backBtn').onclick   = () => location.href='Dean.html';
    $('accountBtn').onclick= () => location.href = 'DeanAccount.html';
  </script>
</body>
</html>
